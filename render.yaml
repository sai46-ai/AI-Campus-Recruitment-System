# ==============================================================================
# AI CAMPUS RECRUITMENT SYSTEM — RENDER INFRASTRUCTURE BLUEPRINT (render.yaml)
# ==============================================================================
# Architecture:
#   - Frontend: Hosted on Vercel (Edge CDN + SPA + Proxy)
#   - Backend: Render Web Service (Node.js 20 + Express v2 + MongoDB Atlas)
#   - AI Service: Render Private Service (Python 3.10 + FastAPI + NLP)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND API WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: ai-campus-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    disk:
      name: resume-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://ai-campus-recruitment.vercel.app
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: ai-campus-ai-service
          property: hostAndPort
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ALLOW_PRODUCTION_SEED
        value: "true"
      - key: ALLOW_DEV_OTP
        value: "true"
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. AI MICROSERVICE (PRIVATE SERVICE)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: ai-campus-ai-service
    runtime: python
    rootDir: ai-service
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.10.12

