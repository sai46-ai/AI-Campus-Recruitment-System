# ==============================================================================
# AI CAMPUS RECRUITMENT SYSTEM — RENDER INFRASTRUCTURE BLUEPRINT (render.yaml)
# ==============================================================================
# Architecture:
#   1. ai-campus-frontend: Render Static Site (React 18 + Vite + Three.js)
#   2. ai-campus-backend: Render Web Service (Node.js 20 + Express v2 + MongoDB)
#   3. ai-campus-ai-service: Render Private Service (Python 3.10 + FastAPI + Pure Python NLP)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND STATIC SITE
  # ----------------------------------------------------------------------------
  - type: web
    name: ai-campus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ai-campus-backend.onrender.com/api/v1

  # ----------------------------------------------------------------------------
  # 2. BACKEND API WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: ai-campus-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    disk:
      name: resume-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://ai-campus-frontend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: ai-campus-ai-service
          property: hostAndPort
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ALLOW_PRODUCTION_SEED
        value: "true"
      - key: ALLOW_DEV_OTP
        value: "true"
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 3. AI MICROSERVICE (PRIVATE SERVICE)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: ai-campus-ai-service
    runtime: python
    rootDir: ai-service
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.10.12

